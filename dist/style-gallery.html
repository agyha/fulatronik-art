<body class="graffiti-overview style-overview"><a class="skip" href="#main">Skip to gallery</a><header><a href="art-gallery.html">← Back to the Art Gallery</a><span>FULATRONIK <small>by Camila ♥</small></span></header>
<main id="main"><div class="heading"><div><p>02 / THE ART GALLERY</p><h1>My Style Gallery</h1></div><p>Scroll to discover. Click a painting to see it closer.</p></div><section class="graffiti-grid" aria-label="My Style artwork overview"><button class="graffiti-artwork" data-title="Bull Shark" data-year="2026" data-size="24 × 48" data-medium="Acrylics and spray paint on canvas" data-description="A vibrant abstract seascape where a powerful bull shark emerges through sweeping currents of blue, green, turquoise, and earthy tones." aria-label="Enlarge Bull Shark"><img src="assets/bull-shark-2026-48-24-preview.jpg" srcset="assets/bull-shark-2026-48-24-mobile.jpg 640w, assets/bull-shark-2026-48-24-preview.jpg 1000w" sizes="(max-width:650px) 90vw, 45vw" alt="Bull Shark by Fulatronik" decoding="async"><span>Bull Shark</span></button><button class="graffiti-artwork" data-title="Echos of the Koi" data-year="2026" data-size="30 × 30" data-medium="Acrylics and spray paint on canvas" data-description="Energetic fluidity and current this represents the worldly challenges and obstacles that a koi must push through this vibrant movements" aria-label="Enlarge Echos of the Koi"><img src="assets/echos-of-the-koi-2026-30-30-preview.jpg" srcset="assets/echos-of-the-koi-2026-30-30-mobile.jpg 640w, assets/echos-of-the-koi-2026-30-30-preview.jpg 1000w" sizes="(max-width:650px) 90vw, 45vw" alt="Echos of the Koi 2026 by Fulatronik" decoding="async" loading="lazy"><span>Echos of the Koi</span></button><button class="graffiti-artwork" data-title="Shadows of the ocean" data-year="2026" data-size="36 × 36" data-medium="Acrylics and spray paint on canvas" data-description="Dynamic abstract composition that visually captures the continues movement, deep and hidden layers of marine life and ocean currents" aria-label="Enlarge Shadows of the ocean"><img src="assets/shadows-of-the-ocean-2026-36-36-preview.jpg" srcset="assets/shadows-of-the-ocean-2026-36-36-mobile.jpg 640w, assets/shadows-of-the-ocean-2026-36-36-preview.jpg 1000w" sizes="(max-width:650px) 90vw, 45vw" alt="Shadows of the ocean 2026 by Fulatronik" decoding="async" loading="lazy"><span>Shadows of the ocean</span></button><button class="graffiti-artwork" data-title="DNA of the Ocean" data-year="2026" data-size="40 × 30" data-medium="Acrylics and spray paint on canvas" data-description="This vibrant canvas captures a stylized interpretation of maritime movement and the literal and symbolic &quot;blueprint&quot; of the sea" aria-label="Enlarge DNA of the Ocean"><img src="assets/dna-of-the-ocean-2026-30-40-preview.jpg" srcset="assets/dna-of-the-ocean-2026-30-40-mobile.jpg 640w, assets/dna-of-the-ocean-2026-30-40-preview.jpg 1000w" sizes="(max-width:650px) 90vw, 45vw" alt="DNA of the Ocean 2026 by Fulatronik" decoding="async" loading="lazy"><span>DNA of the Ocean</span></button><button class="graffiti-artwork" data-title="Abyssal Reef" data-year="2026" data-size="20 × 16" data-medium="Acrylics and spray paint on canvas" data-description="Abstract, dynamic painting with circular composition and reach mutil layer textures to evoke the hidden deep and chaotic beauty of the deep see ecosystem." aria-label="Enlarge Abyssal Reef"><img src="assets/abyssal-reef-2026-20-16-preview.jpg" srcset="assets/abyssal-reef-2026-20-16-mobile.jpg 640w, assets/abyssal-reef-2026-20-16-preview.jpg 1000w" sizes="(max-width:650px) 90vw, 45vw" alt="Abyssal Reef 2026 by Fulatronik" decoding="async" loading="lazy"><span>Abyssal Reef</span></button><button class="graffiti-artwork" data-title="Heart in the chaos" data-year="2020" data-size="24 × 24" data-medium="Acrylics paint and markers on canvas" data-description="Representation of emotional resilience and inner passion. Signifying that love, hope and core humanity can endure through the most chaotic times." aria-label="Enlarge Heart in the chaos"><img src="assets/heart-in-the-chaos-2020-24-24-preview.jpg" srcset="assets/heart-in-the-chaos-2020-24-24-mobile.jpg 640w, assets/heart-in-the-chaos-2020-24-24-preview.jpg 1000w" sizes="(max-width:650px) 90vw, 45vw" alt="Heart in the chaos 2020 by Fulatronik" decoding="async" loading="lazy"><span>Heart in the chaos</span></button><button class="graffiti-artwork" data-title="Kinetic current" data-year="2026" data-size="40 × 30" data-medium="Acrylics and spray paint on canvas" data-description="A visceral abstract composition alive with sweeping arcs, layered textures, and luminous bursts of red, pink, orange, and green, evoking kinetic energy, turbulence, and an electric current pulsing through darkness." aria-label="Enlarge Kinetic current"><img src="assets/kinetic-current-2026-30-40-preview.jpg" srcset="assets/kinetic-current-2026-30-40-mobile.jpg 640w, assets/kinetic-current-2026-30-40-preview.jpg 1000w" sizes="(max-width:650px) 90vw, 45vw" alt="Kinetic current - 2026 by Fulatronik" decoding="async" loading="lazy"><span>Kinetic current</span></button><button class="graffiti-artwork" data-title="The blue enigma" data-year="2026" data-size="30 × 30" data-medium="Acrylics and spray paint on canvas" data-description="Deep oceans with many imaginary creatures" aria-label="Enlarge The blue enigma"><img src="assets/the-blue-enigma-2026-30-30-preview.jpg" srcset="assets/the-blue-enigma-2026-30-30-mobile.jpg 640w, assets/the-blue-enigma-2026-30-30-preview.jpg 1000w" sizes="(max-width:650px) 90vw, 45vw" alt="The blue enigma - 2026 by Fulatronik" decoding="async" loading="lazy"><span>The blue enigma</span></button></section><p class="note">Eight original artworks by Fulatronik. Select any painting for an enlarged view.</p></main><dialog id="enlarged" aria-labelledby="large-title"><button id="close" aria-label="Close enlarged painting">×</button><img id="large-image" alt=""><h2 id="large-title"></h2><p id="large-note"></p></dialog></body></html>
